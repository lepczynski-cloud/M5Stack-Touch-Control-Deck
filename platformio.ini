[platformio]
default_envs = cores3_se

[env:cores3_se]
platform = espressif32 @ 7.1.3
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
board_build.partitions = default_16MB.csv
extra_scripts = pre:tools/ensure_platformio_deps.py

build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

lib_deps =
    m5stack/M5Unified @ 0.2.22
    h2zero/NimBLE-Arduino @ 2.5.1
    https://github.com/Berg0162/ESP32-NIMBLE-Keyboard.git#1f04c04

lib_ldf_mode = deep+
